<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="256" viewBox="0 0 1100 256" role="img" aria-labelledby="title desc">
 <title id="title">SelfGuide collaboration loop</title>
 <desc id="desc">A user defines the task. ChatGPT plans and asks for evidence. Codex executes on the server, validates results, and returns evidence to ChatGPT for review.</desc>
 <defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6" fill="none" stroke="#91a4bc" stroke-width="1.5"/></marker></defs>
 <rect width="1100" height="256" rx="16" fill="#101827"/>
 <g font-family="Arial, Helvetica, sans-serif">
  <text x="32" y="34" fill="#8296b1" font-size="11" letter-spacing="2">THE FEEDBACK LOOP</text>
  <g fill="none" stroke="#91a4bc" stroke-width="1.5" marker-end="url(#arrow)"><path d="M190 114 H240"/><path d="M462 114 H530"/><path d="M752 114 H820"/><path d="M944 164 V215 H350 V164"/></g>
  <rect x="32" y="67" width="158" height="96" rx="12" fill="#192438" stroke="#3a4a64"/>
  <text x="52" y="95" fill="#93a5c1" font-size="11">01 / DEFINE</text><text x="52" y="126" fill="#f2f6ff" font-size="21" font-weight="700">Your task</text><text x="52" y="146" fill="#a8b7cd" font-size="11">Goal + acceptance criteria</text>
  <rect x="240" y="67" width="222" height="96" rx="12" fill="#132b30" stroke="#37605e"/>
  <text x="260" y="95" fill="#9ff6dd" font-size="11">02 / GUIDE</text><text x="260" y="126" fill="#f2f6ff" font-size="21" font-weight="700">ChatGPT Web</text><text x="260" y="146" fill="#a8b7cd" font-size="11">Request context + plan next steps</text>
  <rect x="530" y="67" width="222" height="96" rx="12" fill="#202740" stroke="#4d5181"/>
  <text x="550" y="95" fill="#acb8ff" font-size="11">03 / EXECUTE</text><text x="550" y="126" fill="#f2f6ff" font-size="21" font-weight="700">Codex on server</text><text x="550" y="146" fill="#a8b7cd" font-size="11">Inspect files + perform the work</text>
  <rect x="820" y="67" width="248" height="96" rx="12" fill="#192438" stroke="#3a4a64"/>
  <text x="840" y="95" fill="#b3c8e4" font-size="11">04 / VERIFY</text><text x="840" y="126" fill="#f2f6ff" font-size="21" font-weight="700">Results + evidence</text><text x="840" y="146" fill="#a8b7cd" font-size="11">Independent checks + real attachments</text>
  <rect x="445" y="201" width="398" height="28" rx="14" fill="#101827"/>
  <text x="644" y="219" text-anchor="middle" fill="#a8b7cd" font-size="12">Review → request missing information → refine → continue</text>
 </g>
</svg>
