<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>Astra 连接</title>
<style>body{width:340px;margin:20px;font:14px system-ui;color:#20252b}label{display:block;margin:12px 0 4px}input{box-sizing:border-box;width:100%;padding:9px;border:1px solid #bbb;border-radius:6px}button{margin:14px 8px 0 0;padding:9px 12px;cursor:pointer}#status{white-space:pre-wrap;line-height:1.5}small{color:#555}</style>
<h2>Astra 本地浏览器</h2><p>打开你自己的 astra 项目后，将当前标签页连接到服务器。</p>
<label for="endpoint">本地连接地址</label><input id="endpoint" value="http://127.0.0.1:8765">
<label for="token">配对码</label><input id="token" type="password" autocomplete="off"><small>使用服务器生成的配对码，不填 ChatGPT 密码。</small>
<div><button id="bind">连接当前标签页</button><button id="pause">暂停</button></div><p id="status" role="status"></p>
<script src="popup.js"></script></html>
